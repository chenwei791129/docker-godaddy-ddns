version: 2
updates:
  # Alpine runtime and Go builder images. fix(deps) makes release-please cut a
  # patch release, which is what publishes a rebuilt image
  # (docs/adr/0001-alpine-base-for-update-hooks.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
