name: Trivy Security Scan

# Scan with Trivy. Runs weekly (to catch newly-disclosed CVEs in unchanged
# code and images) and on manual dispatch.
#
# The scan itself lives in chenwei791129/.github so the pinned Trivy action
# version is maintained in exactly one place across repositories.
on:
  schedule:
    # Weekly, Monday 06:17 UTC (offset minute to avoid cron congestion).
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  # The published image: base image packages and bundled binaries. Not run on
  # pull requests, which do not publish an image.
  image:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read           # checkout the repository
      security-events: write   # upload SARIF results to the Security tab
    uses: chenwei791129/.github/.github/workflows/trivy-scan.yml@main
    with:
      scan-type: image
      scan-ref: ghcr.io/chenwei791129/godaddy-ddns:latest
      scanners: vuln
      severity: HIGH,CRITICAL
      upload-sarif: true
